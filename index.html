ms:center}.content{max-width:1100px;margin:auto;padding:30px 34px 50px}.grid{display:grid;gap:15px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow)}.hero{background:linear-gradient(115deg,#603652,#794e6c);color:white;border-radius:18px;padding:24px;min-height:190px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}.hero h2{font-size:22px;margin:9px 0 4px}.hero p{color:#f2e8efc9;max-width:420px;font-size:13px}.hero .btn{background:white;color:var(--plum)}.sos-ring{width:100px;height:100px;border:1px solid #ffffff60;border-radius:50%;display:grid;place-items:center;margin-right:25px;z-index:1}.sos-ring button{width:76px;height:76px;border:0;border-radius:50%;background:white;color:var(--red);font-weight:800;font-size:19px}.greeting{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:23px}.greeting h1{font-size:26px;margin:4px 0;letter-spacing:-.7px}.greeting p,.muted{color:var(--muted)}.section-head,.card-top{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.card-top{margin:0 0 14px}.section-head h2,.card-top h3{margin:0;font-size:16px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:650}.primary{background:var(--plum);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:var(--redbg);color:var(--red)}.small{padding:7px 10px;font-size:12px}.tiny{font-size:12px}.status-row{display:flex;gap:12px;align-items:center}.status-row strong{font-size:14px}.status-row small{display:block;color:var(--muted);font-size:12px}.status-icon{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:18px}.purple{background:var(--pale)}.amber{background:var(--amberbg)}.contact-chips,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip,.badge{border-radius:20px;background:#f1efeb;padding:5px 9px;color:#68716d;font-size:11px}.badge.green{background:var(--mint);color:var(--teal)}.badge.amber{background:var(--amberbg);color:var(--amber)}.badge.red{background:var(--redbg);color:var(--red)}.empty{padding:18px;background:#faf9f7;border-radius:11px;text-align:center;color:var(--muted);font-size:13px}.callout{padding:11px 13px;border-radius:10px;background:#f7f5f0;color:#5c6863;font-size:12px;margin:12px 0}.callout.warn{background:var(--amberbg);color:#83571e}.callout.ok{background:var(--mint);color:#336657}.list{display:flex;flex-direction:column;gap:9px}.listitem{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem b{font-size:13px}.listitem small{display:block;color:var(--muted);font-size:12px}.page-title{font-size:25px;margin:0 0 3px}.page-intro{color:var(--muted);font-size:13px;margin:0 0 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650;color:#515c58}.field input,.field select,.field textarea{border:1px solid #deded7;background:white;border-radius:9px;padding:10px;outline:none;color:var(--ink);width:100%}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9a6a89}.guide-card{padding:13px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}.guide-card:hover{border-color:#c9b0c1}.guide-card p{margin:4px 0 0;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:15px 0}.mapbox{height:260px;border-radius:13px;position:relative;background:#e9eee8;background-image:linear-gradient(32deg,transparent 47%,white 48%,white 50%,transparent 51%),linear-gradient(120deg,transparent 40%,white 41%,white 43%,transparent 44%);background-size:140px 110px,180px 140px}.map-label{position:absolute;background:white;border-radius:6px;padding:4px 7px;font-size:10px}.pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#c85e56;color:white;display:grid;place-items:center}.pin:after{content:'!';transform:rotate(45deg)}.pin.low{background:#d6a14c}.timeline{border-left:2px solid #eee8ed;margin:8px;padding-left:17px}.event{position:relative;padding-bottom:14px}.event:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--plum);left:-23px;top:4px}.event h4{margin:0;font-size:13px}.event p{margin:2px 0;color:var(--muted);font-size:11px}.modal-backdrop{position:fixed;inset:0;background:#1c2422a8;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(550px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:22px}.modal h2{margin:0;font-size:20px}.modal p{font-size:13px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:22px;right:22px;z-index:12;background:#26332f;color:white;border-radius:10px;padding:12px 16px;font-size:13px}.mobilebar{display:none}footer{text-align:center;color:#8c928e;font-size:11px;padding:22px}

</style><div class="sidebar"><div class="brand"><div class="brandmark">✳</div><div><strong>saheli</strong><small>Safety, on your terms</small></div></div><nav class="nav" id="sideNav"><div class="nav-label">YOUR SAFETY</div><button data-page="home" class="active">⌂ &nbsp;Home</button><button data-page="sos">◉ &nbsp;Emergency SOS</button><button data-page="journey">↗ &nbsp;Journey check-in</button><button data-page="map">⌖ &nbsp;Safety map</button><div class="nav-label">DIGITAL PROTECTION</div><button data-page="digital">◇ &nbsp;Digital safety</button><button data-page="evidence">▤ &nbsp;Evidence vault</button><button data-page="assistant">✳ &nbsp;Safety assistant</button><button data-page="contacts">♡ &nbsp;Trusted contacts</button><div class="nav-label">PREFERENCES</div><button data-page="settings">⚙ &nbsp;Settings & privacy</button></nav><div class="side-bottom"><div class="privacy-note"><b>🔒 Private by default</b>Your data stays on this device. No accounts or uploads.</div></div></div><main class="main"><header class="topbar"><div class="eyebrow" id="topLabel">PERSONAL SAFETY SPACE</div><div class="topright"><button class="btn secondary small" onclick="setPage('account')">Account / Sync</button><span class="demo-pill">● SIMULATOR AVAILABLE</span><div class="avatar">S</div></div></header><div class="content" id="app"></div></main><nav class="mobilebar" id="mobileNav"><button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="sos"><span>◉</span>SOS</button><button data-page="journey"><span>↗</span>Journey</button><button data-page="digital"><span>◇</span>Digital</button><button data-page="settings"><span>⚙</span>Privacy</button></nav><div id="modalRoot"></div><div id="toastRoot"></div><script>
const STORE='saheli.v1',defaults={contacts:[],journey:null,alerts:[],incidents:[],reports:[],settings:{language:'en',neutral:false,grace:2},checklist:{},demo:{online:true},share:null};let data;try{data={...defaults,...JSON.parse(localStorage.getItem(STORE)||'{}')};data.settings={...defaults.settings,...data.settings};data.demo={...defaults.demo,...data.demo}}catch{data=structuredClone(defaults)}function save(){localStorage.setItem(STORE,JSON.stringify(data))}let page='home';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){let x=document.getElementById('toastRoot');x.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>x.innerHTML='',3000)}function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function safeDate(t){return new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function header(t,d){return `<h1 class="page-title">${t}</h1><p class="page-intro">${d}</p>`}function empty(t){return `<div class="empty">${t}</div>`}function render(){let fn={home:homePage,account:accountPage,sos:sosPage,journey:journeyPage,map:mapPage,digital:digitalPage,evidence:evidencePage,assistant:assistantPage,contacts:contactsPage,settings:settingsPage,simulator:simPage,report:reportPage,privacy:privacyPage,tracker:trackerPage,safe:safePage}[page]||homePage;document.getElementById('app').innerHTML=fn();document.getElementById('topLabel').textContent=page==='home'?'PERSONAL SAFETY SPACE':page.toUpperCase();bind();window.dispatchEvent(new CustomEvent('saheli:page',{detail:page}))}function homePage(){let j=data.journey;return `<div class="greeting"><div><div class="eyebrow">PERSONAL SAFETY SPACE</div><h1>Good afternoon, you’re safe here.</h1><p>Your safety space is ready. You’re in control.</p></div><button class="btn secondary small" onclick="setPage('assistant')">✳ Quick guidance</button></div><section class="hero"><div><span class="badge" style="background:#ffffff25;color:white">READY WHEN YOU ARE</span><h2>Need help right now?</h2><p>Prepare a local alert record. This browser cannot message your contacts; we’ll show you what it did.</p><button class="btn" onclick="setPage('sos')">Open emergency screen →</button></div><div class="sos-ring"><button onclick="triggerSOS()">SOS</button></div></section><div class="section-head"><h2>Today at a glance</h2><a onclick="setPage('settings')">Privacy controls →</a></div><div class="grid two"><section class="panel"><div class="card-top"><h3>Journey & check-in</h3><span class="badge ${j?'green':''}">${j?'ACTIVE':'NOT STARTED'}</span></div>${j?`<div class="status-row"><div class="status-icon">↗</div><div><strong>${esc(j.destination)}</strong><small>Expected ${safeDate(j.arrival)} · every ${j.interval} min</small></div></div><div class="callout ok">Next check-in ${safeDate(j.nextCheck)}</div><button class="btn primary small" onclick="checkIn()">I’m safe</button> <button class="btn secondary small" onclick="endJourney()">End journey</button>`:`<div class="status-row"><div class="status-icon">⌖</div><div><strong>No active journey</strong><small>Plan a route and set a check-in.</small></div></div><button class="btn secondary small" style="margin-top:12px" onclick="setPage('journey')">Start a journey →</button>`}</section><section class="panel"><div class="card-top"><h3>Trusted circle</h3><a onclick="setPage('contacts')">Manage →</a></div>${data.contacts.length?`<div class="contact-chips">${data.contacts.map(c=>`<span class="chip">♡ ${esc(c.name)}</span>`).join('')}</div><div class="callout">${data.contacts.length} saved · not independently verified</div>`:`${empty('Add someone you trust to your circle.')}<button class="btn secondary small" style="margin-top:10px" onclick="setPage('contacts')">Add contact</button>`}</section></div><div class="section-head"><h2>Quick access</h2></div><div class="grid three">${[['digital','◇','Digital safety support','Guided, private response plans'],['evidence','▤','Evidence vault','Save and organize notes'],['map','⌖','Safety map','Google Maps when configured']].map(x=>`<div class="panel" onclick="setPage('${x[0]}')" style="cursor:pointer"><div class="status-icon purple">${x[1]}</div><h3 style="font-size:14px;margin:10px 0 3px">${x[2]}</h3><small class="muted">${x[3]}</small></div>`).join('')}</div><footer>Saheli is a prototype, not an emergency service.</footer>`}function alertList(){return data.alerts.length?`<div class="list">${data.alerts.map(a=>`<div class="listitem"><div><b>${esc(a.kind)}</b><small>${safeDate(a.time)} · ${esc(a.network)}</small></div><span class="badge ${a.status==='Failed'?'red':'amber'}">${esc(a.status)}</span></div>`).join('')}</div>`:empty('No alerts yet. Local alert history appears here.')}
function sosPage(){return `${header('Emergency SOS','Creates a local record only. This browser cannot send SMS or contact your trusted circle.')}<div class="grid two"><section class="panel" style="text-align:center;padding:28px"><div class="status-icon" style="margin:auto;background:var(--redbg);color:var(--red)">◉</div><h2>Emergency alert</h2><p class="tiny muted">No message will be transmitted by this prototype.</p><button class="btn danger" onclick="triggerSOS()">Create SOS alert</button><p><button class="btn secondary" onclick="call112()">☎ Call 112 (India)</button></p><div class="callout warn">If in immediate danger call 112 directly. The browser cannot confirm a call.</div></section><section class="panel"><div class="card-top"><h3>Alert log</h3><button class="btn secondary small" onclick="setPage('simulator')">Simulator</button></div>${alertList()}<p class="tiny muted">Queued is not sent; Sent is not delivered.</p></section></div>`}
function journeyPage(){let j=data.journey;return `${header('Journey check-in','A missed check-in is a possible warning, not proof of emergency. Cancel or end your journey anytime.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>${j?'Active journey':'Plan a journey'}</h3>${j?'<span class="badge green">ACTIVE</span>':''}</div>${j?`<div class="status-row"><div class="status-icon">↗</div><div><b>${esc(j.destination)}</b><small>Arrival ${safeDate(j.arrival)}</small></div></div><div class="callout warn">Reminder → ${data.settings.grace} min grace → demo alert attempt. No contact notification is sent.</div><div class="row"><button class="btn primary" onclick="checkIn()">I’m safe</button><button class="btn secondary" onclick="endJourney()">End journey</button><button class="btn danger small" onclick="simulateMiss()">Demo missed check-in</button></div>`:`<form id="journeyForm"><div class="form-grid"><div class="field full"><label>Destination or journey name</label><input required name="destination" placeholder="Home from work"></div><div class="field"><label>Expected arrival</label><input required type="datetime-local" name="arrival"></div><div class="field"><label>Check-in interval</label><select name="interval"><option>15</option><option selected>30</option><option>45</option><option>60</option></select></div></div><div class="callout">Background reminders and location access are not available in this web build.</div><button class="btn primary">Start journey</button></form>`}</section><section class="panel"><h3>Escalation settings</h3><p class="tiny muted">Grace period before a simulated escalation.</p><div class="field" style="max-width:240px"><label>Grace period (minutes)</label><select id="grace"><option ${data.settings.grace===1?'selected':''}>1</option><option ${data.settings.grace===2?'selected':''}>2</option><option ${data.settings.grace===5?'selected':''}>5</option><option ${data.settings.grace===10?'selected':''}>10</option></select></div><button class="btn secondary small" style="margin-top:10px" onclick="saveGrace()">Save</button></section></div>`}
function contactsPage(){return `${header('Trusted contacts','Saved only on this device. Contacts are not verified and no alerts are transmitted.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Your trusted circle</h3><button class="btn primary small" onclick="contactModal()">＋ Add contact</button></div>${data.contacts.length?`<div class="list">${data.contacts.map(c=>`<div class="listitem"><div><b>${esc(c.name)}</b><small>${esc(c.phone)} · Not verified</small><small>${esc((c.types||[]).join(', '))}</small></div><div><button class="btn secondary small" onclick="contactModal('${c.id}')">Edit</button> <button class="btn danger small" onclick="deleteContact('${c.id}')">×</button></div></div>`).join('')}</div>`:empty('No contacts saved yet.')}</section><section class="panel"><h3>Temporary location sharing</h3><p class="tiny muted">No location is collected or transmitted. This is a local demo preference only.</p>${data.share?`<div class="callout warn">Preference until ${safeDate(data.share.until)}; not sharing location.</div><button class="btn danger small" onclick="stopShare()">Stop now</button>`:`<button class="btn secondary" onclick="shareModal()">Set duration</button>`}<div class="callout">Real contact verification needs a delivery channel.</div></section></div>`}
const guideText={sextortion:['If in immediate danger, seek a safe place and trusted person. You do not have to reply or pay now.','Save messages, usernames, profile links, dates and demands. Keep originals where safe.','Secure email and accounts from a trusted device; change reused passwords, enable MFA and review sessions.','Report content on the platform. India’s cybercrime portal: cybercrime.gov.in. You decide whether to report.','If safe: “Do not contact me again. I am preserving this communication.” Do not reply if it may escalate.'],impersonation:['Avoid engaging if it may escalate; tell a trusted person separately.','Capture profile URL, username, dates and examples.','Secure your account, enable MFA and review sessions.','Report impersonation using the platform tools.','Tell friends: “That profile is not mine. Please don’t engage; report it.”'],unwanted:['Prioritize immediate safety. You do not owe a reply.','Keep dated records, channels, witnesses and original messages.','Review location sharing and account sessions from a trusted device. Block only if safe.','Use platform reporting or seek support if you choose.','If safe: “Do not contact me again.”'],doxxing:['Consider physical safety before changing online settings. Use a trusted device if needed.','Record URLs, screenshots and timestamps; avoid reposting exposed information.','Change exposed passwords, enable MFA, review location sharing.','Report threats/content to platforms and cybercrime.gov.in.','Ask a trusted person to help if useful.'],account:['Use a trusted device if yours may be monitored.','Record unusual login alerts and account changes.','Secure email first, change to unique passwords, enable MFA, review sessions and recovery details.','Use the platform’s official recovery page; never share verification codes.','Warn contacts through a separate channel if your account may be compromised.']};function digitalPage(){return `${header('Digital safety','Guided support. Skip any step; no content is uploaded or submitted.')}<div class="grid two"><section class="panel"><h3>What’s happening?</h3>${[['sextortion','Sextortion & blackmail'],['impersonation','Impersonation'],['unwanted','Repeated unwanted contact'],['doxxing','Doxxing & threats'],['account','Account compromise']].map(a=>`<div class="guide-card" onclick="openGuide('${a[0]}')"><b>${a[1]} →</b><p>Safety-first guidance and optional local incident note.</p></div>`).join('')}</section><section class="panel"><h3>Reporting assistant</h3><p class="tiny muted">Editable draft from saved incidents; never submitted automatically.</p><button class="btn primary" onclick="setPage('report')">Build complaint draft →</button><div class="divider"></div><a class="btn secondary small" href="https://cybercrime.gov.in/" target="_blank" rel="noopener">Open India cybercrime portal ↗</a><div class="divider"></div><button class="btn secondary small" onclick="setPage('tracker')">Monitoring & tracker safety →</button></section></div>`}
function evidencePage(){return `${header('Evidence vault','Local notes only; localStorage is not encrypted. Attachments are not saved or uploaded.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Saved incidents</h3><button class="btn primary small" onclick="incidentModal()">＋ Add incident</button></div>${data.incidents.length?`<div class="list">${data.incidents.map(i=>`<div class="listitem"><div><b>${esc(i.title)}</b><small>${esc(i.category)} · ${safeDate(i.time)}</small><small>${esc(i.note)}</small></div><div><span class="badge ${i.risk==='High'?'red':i.risk==='Medium'?'amber':'green'}">${esc(i.risk)}</span><button class="btn danger small" onclick="deleteIncident('${i.id}')">Delete</button></div></div>`).join('')}</div>`:empty('No incidents saved.')}</section><section class="panel"><h3>Export & metadata</h3><p class="tiny muted">Selected incident records can be exported as JSON. Password-protected PDF/encryption not implemented.</p><button class="btn secondary small" onclick="exportJSON()">Export incident data (.json)</button><div class="callout warn">Evidence is not encrypted. Avoid sensitive content on a shared device.</div><div class="field"><label>Inspect image metadata locally (not saved)</label><input id="exifFile" type="file" accept="image/*"></div><div id="exifResult"></div></section></div>`}
function assistantPage(){return `${header('Offline safety assistant','Built-in core guidance in English, Hindi and Marathi. General information, not professional or emergency advice.')}<section class="panel"><div class="card-top"><h3>Choose a topic</h3><select onchange="setLang(this.value)"><option value="en" ${data.settings.language==='en'?'selected':''}>English</option><option value="hi" ${data.settings.language==='hi'?'selected':''}>हिन्दी</option><option value="mr" ${data.settings.language==='mr'?'selected':''}>मराठी</option></select></div><div class="grid two">${[['unsafe','Unsafe travel'],['danger','Immediate physical danger'],['monitor','Phone monitoring'],['sextortion','Sextortion'],['impersonation','Impersonation'],['doxxing','Doxxing & threats'],['unwanted','Unwanted contact'],['account','Compromised account'],['evidence','Evidence preservation'],['support','Seeking support']].map(a=>`<div class="guide-card" onclick="showAdvice('${a[0]}')"><b>${a[1]} →</b></div>`).join('')}</div><div id="advice"></div></section><div class="callout warn">Immediate danger: call 112 in India. Use a trusted device if phone monitoring is a concern.</div>`}
function mapPage(){return `${header('Safety map','Illustrative only—not live crime data or a safety guarantee. No reports does not mean safe.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Illustrative sample reports</h3><button class="btn primary small" onclick="reportModal()">＋ Add report</button></div><div class="mapbox"><span class="map-label" style="position:absolute;left:40%;top:34%">Nashik Road</span><span class="map-label" style="position:absolute;left:58%;top:68%">College Rd</span><span class="pin" style="left:25%;top:30%"></span><span class="pin low" style="left:68%;top:48%"></span><span class="pin" style="left:51%;top:74%"></span></div><div class="callout warn">Sample markers are illustrative. No route provider or live reports connected.</div></section><section class="panel"><h3>Felt-unsafe reports</h3>${data.reports.length?`<div class="list">${data.reports.map(r=>`<div class="listitem"><div><b>${esc(r.category)} · ${esc(r.area)}</b><small>${safeDate(r.time)} · ${esc(r.severity)} · Unverified</small><small>${esc(r.note)}</small></div><button class="btn danger small" onclick="deleteReport('${r.id}')">Remove</button></div>`).join('')}</div>`:empty('No user reports. Sample markers are illustrative.')}<div class="divider"></div><b>Safe routes</b><p class="tiny muted">No route data available; no safety score generated.</p></section></div>`}
function settingsPage(){return `${header('Settings & privacy','Your browser stores data locally; it is not encrypted. This app does not upload private content.')}<div class="grid two"><section class="panel"><h3>Privacy controls</h3><div class="callout warn">No duress PIN, panic wipe or notification service. The discreet screen cannot guarantee undetectability.</div><button class="btn secondary" onclick="setPage('privacy')">Privacy lockdown & data controls</button><div class="divider"></div><button class="btn secondary" onclick="setPage('tracker')">Monitoring & tracker guidance</button><div class="divider"></div><button class="btn secondary" onclick="setPage('simulator')">Emergency workflow simulator</button></section><section class="panel"><h3>Offline guidance language</h3><div class="field"><label>Language</label><select onchange="setLang(this.value)"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></div><div class="divider"></div><button class="btn danger" onclick="clearData()">Delete all local Saheli data</button><p class="tiny muted">Cannot delete downloads, browser backups or OS traces.</p></section></div>`}

function simPage(){return `${header('Emergency workflow simulator','DEMO MODE — every event below is simulated. No message or call is placed. Reset and repeat scenarios freely.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Choose a scenario</h3><span class="demo-pill">● DEMO MODE</span></div><div class="list"><button class="listitem" onclick="runScenario('success')"><div><b>Successful alert delivery</b><small>Simulated channel reports accepted send; no real delivery.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('poor')"><div><b>Poor connectivity</b><small>Alert queued locally; retry when restored.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('offline')"><div><b>No network → restored</b><small>Queue now, then simulate retry.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('failed')"><div><b>Failed send</b><small>Transport fails; status remains failed.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('missed')"><div><b>Missed check-in & cancellation</b><small>Practice reminder, grace and cancellation.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('escalate')"><div><b>Grace period escalation</b><small>Simulated alert attempt after grace expires.</small></div><span>▶</span></button><button class="listitem" onclick="runScenario('ack')"><div><b>Contact acknowledgement</b><small>Demo-only acknowledgement event.</small></div><span>▶</span></button></div><button class="btn danger small" style="margin-top:14px" onclick="resetDemo()">Reset simulation</button></section><section class="panel"><div class="card-top"><h3>Scenario event log</h3><button class="btn secondary small" onclick="setPage('sos')">View alert log</button></div><div id="scenarioLog">${sessionStorage.getItem('scenarioLog')||empty('Choose a scenario to see simulated events.')}</div></section></div>`}
function privacyPage(){return `${header('Privacy lockdown','Reduce on-screen exposure without destructive wipes. These controls can’t guarantee secrecy or remove operating-system traces.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Discreet interface</h3></div><div class="listitem"><div><b>Neutral notification previews</b><small>No notifications are sent by this web app.</small></div><input type="checkbox" class="switch" ${data.settings.neutral?'checked':''} onchange="data.settings.neutral=this.checked;save();toast('Preference saved locally')"></div><div class="listitem"><div><b>Discreet screen</b><small>Switch to neutral guidance page.</small></div><button class="btn secondary small" onclick="setPage('safe')">Open</button></div><div class="listitem"><div><b>Duress PIN</b><small>Not supported in this web prototype.</small></div><span class="badge amber">ROADMAP</span></div><div class="callout warn">A discreet screen cannot guarantee an abuser won’t find the app. No panic wipe is performed.</div></section><section class="panel"><div class="card-top"><h3>Local data controls</h3></div><p class="tiny muted">Saved contacts, journeys, alerts and incident notes use browser localStorage. It is not encrypted and can be visible to others with device access.</p><button class="btn secondary small" onclick="exportMobileMigration()">Export local data for Saheli Mobile (.json)</button><p class="tiny muted">Contains selected contact and incident text. Keep the file private; evidence files are excluded.</p><button class="btn danger" onclick="clearData()">Delete all Saheli data on this browser</button><div class="divider"></div><p class="tiny muted">This deletes records managed by this prototype; it cannot erase browser backups, screenshots, downloads or operating-system traces.</p><label class="field"><span class="tiny">Language for offline guidance</span><select id="settingsLang" onchange="setLang(this.value)"><option value="en" ${data.settings.language==='en'?'selected':''}>English</option><option value="hi" ${data.settings.language==='hi'?'selected':''}>हिन्दी</option><option value="mr" ${data.settings.language==='mr'?'selected':''}>मराठी</option></select></label><div class="divider"></div><button class="btn secondary small" onclick="setPage('simulator')">Emergency simulator</button></section></div>`}
function trackerPage(){return `${header('Monitoring & unknown-tracker safety','Safety-first guidance. The web platform cannot inspect installed apps or detect trackers. These checks are not proof of monitoring.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Discreet Safe Mode</h3><span class="badge green">GUIDANCE ONLY</span></div><button class="btn secondary" onclick="setPage('safe')">Open neutral screen</button><div class="callout warn">If changing the monitored phone could increase danger, use a trusted device to seek help. Do not rush to remove apps or disable a tracker.</div><h3 style="font-size:14px">Guided checklist</h3>${['Unfamiliar apps','Device administrator access','Accessibility permissions','Notification access','Location and microphone permissions','Unusual battery or mobile-data usage','Unexpected work/profile management'].map((x,n)=>`<label class="listitem"><div><b>${x}</b><small>Review only when safe. A finding is a warning sign, not proof.</small></div><input type="checkbox" class="switch" ${data.checklist[n]?'checked':''} onchange="data.checklist[${n}]=this.checked;save()"></label>`).join('')}</section><section class="panel"><div class="card-top"><h3>Android permission scanner</h3><span class="badge amber">NOT AVAILABLE ON WEB</span></div><p class="tiny muted">Browsers cannot enumerate other installed apps or inspect their permissions. Android apps must use permitted package visibility APIs; results may be incomplete.</p><div class="empty">No installed-app scan performed. No application can be labelled spyware from this screen.</div><div class="divider"></div><h3 style="font-size:14px">Unknown tracker guidance</h3><ul class="tiny muted"><li>Android: check Settings for “Unknown tracker alerts” or open Safety & emergency, depending on version.</li><li>iPhone: review unwanted tracking alerts in Find My and Settings; supported alerts depend on iOS version and accessory.</li><li>Follow the operating system’s instructions. Disabling a tracker might alert another person or increase risk.</li></ul><div class="callout">Manual Bluetooth scanning is not a complete detector. No scan or location tracking is performed here.</div></section></div>`}
function safePage(){return `<div style="max-width:700px;margin:7vh auto"><div class="eyebrow">SAHELI · GENERAL INFORMATION</div><h1 class="page-title" style="margin-top:18px">A quiet moment</h1><p class="page-intro">Take a breath. You can close this page whenever you want.</p><div class="panel"><h3 style="font-size:16px">If you’re concerned your phone is monitored</h3><p class="muted">Consider using a trusted device to contact someone you trust. Changing settings or removing an app can sometimes alert another person. There is no automatic scan or deletion here.</p><button class="btn secondary" onclick="setPage('home')">Return to Saheli</button><a class="btn secondary" href="https://www.google.com" style="text-decoration:none;margin-left:6px">Leave this page ↗</a></div><p class="tiny muted">A neutral screen cannot guarantee that app use or browsing is undetectable.</p></div>`}
function reportPage(){const selected=data.incidents;return `${header('Complaint & reporting assistant','Create an editable draft from your locally saved notes. Nothing is filed or shared unless you choose to export it.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>Select incident entries</h3></div>${selected.length?selected.map(i=>`<label class="listitem"><div><b>${esc(i.title)}</b><small>${safeDate(i.time)} · ${esc(i.category)}</small></div><input type="checkbox" class="switch report-check" value="${i.id}" checked></label>`).join(''):empty('No saved entries yet. Add an incident in the Evidence Vault first.')}<div class="divider"></div><p class="tiny muted">Official reporting portal: submit directly on the official site after reviewing your details.</p><a class="btn secondary small" href="https://cybercrime.gov.in/" target="_blank" rel="noopener">Open cybercrime.gov.in ↗</a></section><section class="panel"><div class="card-top"><h3>Editable draft</h3><span class="badge amber">NOT SUBMITTED</span></div><div class="field"><label>Incident summary</label><textarea id="draftText" style="min-height:220px">${esc(selected.map(i=>`${safeDate(i.time)} — ${i.title} (${i.category})\n${i.note||''}`).join('\n\n'))}</textarea></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="generateDraft()">Refresh from selected</button><button class="btn primary" onclick="downloadDraft()">Download draft (.txt)</button></div><div class="callout warn">Review all details and remove anything you do not wish to disclose. No complaint is submitted through Saheli.</div></section></div>`}
function openGuide(id){activeGuide=id;const steps=guideText[id]||[];showModal(`<h2>${esc(({sextortion:'Sextortion & blackmail',impersonation:'Impersonation',unwanted:'Repeated unwanted contact',doxxing:'Doxxing & threats',account:'Account compromise'})[id])}</h2><p>Choose only what feels safe. These steps are private and can be skipped.</p>${steps.map((s,i)=>`<div class="guide-card"><strong>${['1. Safety first','2. Preserve evidence','3. Secure accounts','4. Reporting options','5. Optional reply'][i]||'Step'}</strong><p>${esc(s)}</p></div>`).join('')}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();incidentModal('${id}')">Save incident note</button></div>`)}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));const f=document.getElementById('journeyForm');if(f)f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.destination.trim())return;let arrival=new Date(v.arrival).getTime();if(!Number.isFinite(arrival))return toast('Please choose an arrival time');data.journey={id:crypto.randomUUID(),destination:v.destination.trim(),arrival,interval:+v.interval,nextCheck:Date.now()+(+v.interval*60000),contact:v.contact||'',status:'active'};save();toast('Journey started on this device');render()};const ex=document.getElementById('exifFile');if(ex)ex.onchange=inspectImage}
function triggerSOS(){const alert={id:crypto.randomUUID(),kind:'SOS alert',time:Date.now(),status:'Queued',network:navigator.onLine?'Online — no delivery channel configured':'Offline',message:`I may need help. This alert was created in Saheli at ${new Date().toLocaleString()}. No location attached.`};data.alerts.unshift(alert);save();if(page==='sos')render();else setPage('sos');toast('Local alert created — no message was sent');}
function call112(){window.location.href='tel:112';toast('Use your phone to call 112. This app cannot confirm a call was placed.')}function saveGrace(){data.settings.grace=+document.getElementById('grace').value;save();toast('Grace period preference saved')}
function checkIn(){if(!data.journey)return;data.journey.nextCheck=Date.now()+data.journey.interval*60000;data.journey.lastCheck=Date.now();save();toast('Check-in recorded locally — you’re marked safe');render()}function endJourney(){if(!data.journey)return;data.journey=null;save();toast('Journey ended');render()}function simulateMiss(){if(!data.journey){toast('Start a journey first');return}showModal(`<h2>Missed check-in · DEMO MODE</h2><p>This is a demonstration, not evidence of an emergency. You can cancel now or continue a simulated grace period.</p><div class="callout warn">Reminder sent locally. No contacts have been notified.</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal();toast('Demo escalation cancelled')">I’m safe — cancel</button><button class="btn primary" onclick="closeModal();runScenario('escalate')">Continue demo escalation</button></div>`)}
function contactModal(id){const c=data.contacts.find(x=>x.id===id);showModal(`<h2>${c?'Edit contact':'Add trusted contact'}</h2><p>Stored only in this browser; contact is not verified and alerts are not transmitted.</p><form id="contactForm"><div class="form-grid"><div class="field"><label>Name</label><input required name="name" value="${esc(c?.name||'')}"></div><div class="field"><label>Phone or email</label><input required name="phone" value="${esc(c?.phone||'')}"></div><div class="field full"><label>Alert types</label><div class="row"><label><input type="checkbox" name="type" value="SOS" checked> SOS</label><label><input type="checkbox" name="type" value="Journey"> Journey</label><label><input type="checkbox" name="type" value="Digital"> Digital</label></div></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save locally</button></div></form>`);document.getElementById('contactForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),obj={id:c?.id||crypto.randomUUID(),name:fd.get('name').trim(),phone:fd.get('phone').trim(),types:fd.getAll('type'),verified:false};if(!obj.name||!obj.phone)return;let idx=data.contacts.findIndex(x=>x.id===obj.id);idx<0?data.contacts.push(obj):data.contacts[idx]=obj;save();closeModal();render();toast('Contact saved locally — not verified')};}
function deleteContact(id){if(confirm('Remove this contact from this browser?')){data.contacts=data.contacts.filter(c=>c.id!==id);save();render()}}function shareModal(){showModal(`<h2>Temporary location sharing</h2><p>Location sharing is not connected. This saves only a local preference; no location is collected or transmitted.</p><div class="field"><label>Duration</label><select id="shareDuration"><option value="1">1 hour</option><option value="4">4 hours</option><option value="12">12 hours</option></select></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="data.share={until:Date.now()+document.getElementById('shareDuration').value*3600000};save();closeModal();render()">Save local demo preference</button></div>`)}function stopShare(){data.share=null;save();render();toast('Sharing preference stopped')}
function incidentModal(cat=''){let pre={sextortion:'Sextortion / blackmail',impersonation:'Impersonation',unwanted:'Repeated unwanted contact',doxxing:'Doxxing / threats',account:'Account compromise'}[cat]||'';showModal(`<h2>Add incident note</h2><p>Save only information you choose. Avoid names or details if they could put you at risk.</p><form id="incForm"><div class="form-grid"><div class="field"><label>Title</label><input required name="title" value="${esc(pre)}" placeholder="Brief description"></div><div class="field"><label>Category</label><select name="category"><option>Physical safety</option><option>Harassment</option><option>Sextortion</option><option>Impersonation</option><option>Doxxing</option><option>Account compromise</option><option>Other</option></select></div><div class="field"><label>Risk label (organizing aid only)</label><select name="risk"><option>Low</option><option>Medium</option><option>High</option></select></div><div class="field"><label>Sender/platform (optional)</label><input name="sender" placeholder="User supplied"></div><div class="field full"><label>Context or evidence reference</label><textarea name="note" placeholder="Text only. No automatic capture or upload."></textarea></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save locally</button></div></form>`);document.getElementById('incForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.title.trim())return;data.incidents.unshift({...v,id:crypto.randomUUID(),time:Date.now()});save();closeModal();render();toast('Incident saved locally')};}
function deleteIncident(id){if(confirm('Delete this incident note?')){data.incidents=data.incidents.filter(i=>i.id!==id);save();render()}}function reportModal(){showModal(`<h2>Add felt-unsafe report</h2><p>Local illustrative report only; not public or independently verified. Do not name or identify people.</p><form id="reportForm"><div class="form-grid"><div class="field"><label>Area (avoid precise home address)</label><input required name="area" placeholder="e.g. Public transit stop"></div><div class="field"><label>Category</label><select name="category"><option>Lighting</option><option>Harassment</option><option>Transport</option><option>Other concern</option></select></div><div class="field"><label>Severity</label><select name="severity"><option>Low</option><option>Moderate</option><option>High</option></select></div><div class="field full"><label>Optional note</label><textarea name="note"></textarea></div></div><div class="modal-actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save locally</button></div></form>`);document.getElementById('reportForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));data.reports.unshift({...v,id:crypto.randomUUID(),time:Date.now(),verified:false});save();closeModal();render();toast('Report saved locally; remains unverified')};}function deleteReport(id){data.reports=data.reports.filter(r=>r.id!==id);save();render()}
function runScenario(type){let log=[];const add=(txt)=>log.push(`<div class="event"><h4>${txt}</h4><p>${new Date().toLocaleTimeString()} · SIMULATED</p></div>`);let status='Queued';if(type==='success'){add('Alert prepared');add('Simulated transport accepted request');add('Sent · DEMO ONLY (not delivered)');status='Sent'}else if(type==='poor'||type==='offline'){data.demo.online=false;add('Connectivity unavailable');add('Alert queued locally; no send attempted');status='Queued'}else if(type==='failed'){add('Simulated transport returned failure');status='Failed'}else if(type==='missed'){add('Check-in reminder displayed');add('Grace period started');add('User cancelled escalation');status='Cancelled'}else if(type==='escalate'){add('Grace period expired');add('Simulated alert attempt to selected circle');add('No external delivery configured');status='Queued'}else if(type==='ack'){add('Demo contact acknowledgement recorded');add('DEMO ONLY — no contact received an alert');status='Acknowledged'}if(type==='offline'||type==='poor')setTimeout(()=>{add('Connectivity restored');add('Retry available — no actual transport configured');sessionStorage.setItem('scenarioLog',`<div class="timeline">${log.join('')}</div>`);if(page==='simulator')render()},1000);data.alerts.unshift({id:crypto.randomUUID(),kind:`Demo: ${type}`,time:Date.now(),status,network:'SIMULATED'});save();sessionStorage.setItem('scenarioLog',`<div class="timeline">${log.join('')}</div>`);render();toast(`Demo scenario: ${status} · No real alert sent`)}function resetDemo(){data.alerts=data.alerts.filter(a=>!a.kind.startsWith('Demo:'));data.demo.online=true;sessionStorage.removeItem('scenarioLog');save();render();toast('Demo reset')}

async function inspectImage(e){const f=e.target.files?.[0],el=document.getElementById('exifResult');if(!f)return;let buf=await f.arrayBuffer(),bytes=new Uint8Array(buf),gps=false,exif=false;if(f.type==='image/jpeg'){for(let i=2;i<bytes.length-4;){if(bytes[i]!==0xff){i++;continue}let marker=bytes[i+1],len=bytes[i+2]*256+bytes[i+3];if(marker===0xe1&&String.fromCharCode(...bytes.slice(i+4,i+10))==='Exif\0\0'){exif=true;let end=Math.min(i+2+len,bytes.length),s=String.fromCharCode(...bytes.slice(i+4,end));gps=s.includes('GPS');break}i+=2+len}}el.innerHTML=`<div class="callout">${f.type==='image/jpeg'?`JPEG metadata check: ${exif?'EXIF block present':'No EXIF block found'}${gps?' · GPS tag indicator found':' · GPS tag not detected'}.`:'This format cannot be inspected by this basic prototype.'} File was read locally in memory and is not saved or uploaded. This check is limited and cannot guarantee all metadata is removed.</div>`}

const DB_NAME='saheli-evidence-v1';let journeyTimer=null;
function openEvidenceDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function idbPut(fileRecord){const db=await openEvidenceDB();return new Promise((res,rej)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(fileRecord);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGetAll(){const db=await openEvidenceDB();return new Promise((res,rej)=>{let q=db.transaction('files').objectStore('files').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbDelete(id){const db=await openEvidenceDB();return new Promise((res,rej)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

function triggerSOS(){const now=Date.now(),existing=data.alerts.find(a=>a.kind==='SOS alert'&&now-a.time<10000);if(existing){toast('Duplicate prevented: SOS created moments ago');setPage('sos');return}let a={id:crypto.randomUUID(),kind:'SOS alert',time:now,status:'Queued',network:navigator.onLine?'Online; no delivery transport configured':'Offline',retryCount:0,deliveryEvidence:null,message:`Help requested from Saheli at ${new Date(now).toLocaleString()}. No location included.`};data.alerts.unshift(a);save();if(page!=='sos')setPage('sos');else render();toast('Queued locally. No message was sent.')}

function startJourneyTimer(){clearInterval(journeyTimer);journeyTimer=setInterval(tickJourney,1000);tickJourney()}
function tickJourney(){let j=data.journey;if(!j)return;let now=Date.now();if(j.stage==='monitoring'&&now>=j.nextCheck){j.stage='grace';j.graceUntil=now+data.settings.grace*60000;j.reminderAt=now;save();toast('Journey check-in due. Grace period started.');if(page==='journey')render()}else if(j.stage==='grace'&&now>=j.graceUntil){j.stage='escalation_attempted';j.escalationAt=now;j.escalationStatus='Simulated only — no delivery configured';save();toast('Grace expired. Demo escalation recorded; no contact alerted.');if(page==='journey')render()}}
function checkIn(){if(!data.journey)return;data.journey.stage='monitoring';data.journey.nextCheck=Date.now()+data.journey.interval*60000;delete data.journey.graceUntil;delete data.journey.escalationAt;save();render();toast('Check-in saved. You are marked safe.')}

function journeyPage(){let j=data.journey;return `${header('Journey check-in','A missed check-in is a warning, not proof of emergency. Keep this browser page open; background timers can pause.')}<div class="grid two"><section class="panel"><div class="card-top"><h3>${j?'Active journey':'Plan a journey'}</h3>${j?`<span class="badge ${j.stage==='monitoring'?'green':'amber'}">${esc(j.stage.toUpperCase())}</span>`:''}</div>${j?`<div class="status-row"><div class="status-icon">↗</div><div><b>${esc(j.destination)}</b><small>Arrival ${safeDate(j.arrival)} · check every ${j.interval} min</small></div></div><div class="callout ${j.stage==='monitoring'?'ok':'warn'}">${j.stage==='monitoring'?`Next reminder ${safeDate(j.nextCheck)}`:j.stage==='grace'?`Grace period ends ${safeDate(j.graceUntil)} · cancel by checking in`:j.escalationStatus}</div><div class="row"><button class="btn primary" onclick="checkIn()">I’m safe</button><button class="btn secondary" onclick="endJourney()">End journey</button><button class="btn danger small" onclick="simulateMiss()">Demo missed check-in</button></div>`:`<form id="journeyForm"><div class="form-grid"><div class="field full"><label>Destination / journey name</label><input name="destination" required placeholder="Home from work"></div><div class="field"><label>Expected arrival</label><input type="datetime-local" name="arrival" required></div><div class="field"><label>Check-in interval (minutes)</label><select name="interval"><option>15</option><option selected>30</option><option>45</option><option>60</option></select></div></div><div class="callout">Background reminders are not guaranteed. No location collected.</div><button class="btn primary">Start journey</button></form>`}</section><section class="panel"><h3>Escalation settings</h3><p class="tiny muted">Reminder → grace period → simulated alert attempt. No external channel configured.</p><div class="field"><label>Grace period (minutes)</label><select id="grace"><option ${data.settings.grace== async function storeEvidenceFiles(ev){let incident=data.incidents.find(i=>i.id===document.getElementById('attachIncident').value);if(!incident)return toast('Create an incident first');let status=document.getElementById('fileStatus');for(const f of ev.target.files){try{let bytes=await f.arrayBuffer(),digest=await crypto.subtle.digest('SHA-256',bytes),hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join(''),id=crypto.randomUUID();await idbPut({id,incidentId:incident.id,name:f.name,type:f.type,size:f.size,lastModified:f.lastModified,hash,blob:f});incident.files=incident.files||[];incident.files.push({id,name:f.name,type:f.type,size:f.size,hash,added:Date.now()});status.textContent=`Saved ${f.name} · SHA-256 ${hash}`;}catch(err){status.textContent=`Could not save file: ${err.message}. Browser storage quota or secure-context crypto may be unavailable.`}}save();render()}

fy submissions or confirmations.</p></section></div>`}
function generateDraft(){let ids=[...document.querySelectorAll('.report-check:checked')].map(x=>x.value),chosen=data.incidents.filter(i=>ids.includes(i.id));document.getElementById('draftText').value=chosen.map(i=>`${safeDate(i.time)} — ${i.title} (${i.category})\nSender/platform: ${i.sender||'not provided'}\n${i.note||''}\nEvidence references: ${(i.files||[]).map(f=>`${f.name} SHA-256 ${f.hash}`).join('; ')||'none'}`).join('\n\n')||'No entries selected.'}
const advice={unsafe:'Move toward a staffed, well-lit public place if that feels safer. Contact someone you trust. No route can be guaranteed safe.',danger:'Move away from immediate danger if possible. Call 112 in India or ask a trusted nearby person for help.',monitor:'Do not rush to remove apps or change settings. Use a trusted device to seek help; observations are not proof of monitoring.',sextortion:'Prioritize safety. You do not have to reply or pay right now. Preserve messages, usernames and dates.',impersonation:'Do not engage if it may escalate. Preserve the profile URL and report it using platform tools.',doxxing:'Prioritize physical safety. Preserve URLs and timestamps; avoid reposting exposed information. Secure accounts from a trusted device.',unwanted:'Prioritize safety; preserve dated contact records. You do not owe a reply. Block only if safe.',account:'Secure email first from a trusted device, change reused passwords, enable MFA, review sessions and recovery details.',evidence:'Preserve original messages, account URLs, dates and context. Avoid editing originals; nothing is uploaded here.',support:'Contact someone you trust or a local support service. India cybercrime portal: cybercrime.gov.in; emergency: 112.'};function showAdvice(id){let text=advice[id]||advice.danger,hi={unsafe:'यदि सुरक्षित लगे तो रोशनी वाली सार्वजनिक जगह जाएँ और भरोसेमंद व्यक्ति से संपर्क करें। कोई रास्ता पूरी तरह सुरक्षित होने की गारंटी नहीं देता।',danger:'संभव हो तो खतरे से दूर जाएँ। भारत में 112 पर कॉल करें या भरोसेमंद व्यक्ति से मदद माँगें।',monitor:'ऐप हटाने या सेटिंग बदलने की जल्दी न करें। भरोसेमंद डिवाइस से सहायता लें। ये संकेत निगरानी का प्रमाण नहीं हैं।',sextortion:'तात्कालिक खतरे में पहले सुरक्षित जगह जाएँ। अभी जवाब या भुगतान करना ज़रूरी नहीं। संदेश और तारीखें सुरक्षित रखें।',support:'भरोसेमंद व्यक्ति/स्थानीय सेवा से संपर्क करें। भारत में cybercrime.gov.in आधिकारिक पोर्टल है; आपात स्थिति में 112।'},mr={unsafe:'शक्य असल्यास प्रकाश असलेल्या सार्वजनिक ठिकाणी जा आणि विश्वासू व्यक्तीशी संपर्क साधा. कोणताही मार्ग पूर्णपणे सुरक्षित असल्याची हमी नाही.',danger:'शक्य असल्यास धोक्यापासून दूर जा. भारतात 112 वर कॉल करा किंवा विश्वासू व्यक्तीकडून मदत मागा.',monitor:'अॅप काढण्याची घाई करू नका. विश्वासू उपकरणावरून मदत घ्या. ही चिन्हे निरीक्षणाचा पुरावा नाहीत.',sextortion:'तातडीचा धोका असल्यास आधी सुरक्षित ठिकाणी जा. आत्ता उत्तर किंवा पैसे देणे आवश्यक नाही. संदेश आणि तारखा जतन करा.',support:'विश्वासू व्यक्तीशी किंवा स्थानिक सेवेशी संपर्क साधा. cybercrime.gov.in अधिकृत पोर्टल आहे; आपत्कालीन मदतीसाठी 112.'};let fullHi={...hi,impersonation:'नकली प्रोफ़ाइल से बहस न करें यदि इससे जोखिम बढ़े। प्रोफ़ाइल URL, उपयोगकर्ता नाम और तारीख सुरक्षित रखें। मंच पर प्रतिरूपण की रिपोर्ट करें और अपने खाते की MFA/लॉगिन जाँचें।',doxxing:'पहले अपनी शारीरिक सुरक्षा देखें। उजागर सामग्री के URL और तारीख सुरक्षित रखें, उसे दोबारा साझा न करें। भरोसेमंद डिवाइस से पासवर्ड और लोकेशन साझाकरण जाँचें; मंच पर रिपोर्ट करें।',unwanted:'तत्काल खतरे में सुरक्षित स्थान और भरोसेमंद सहायता चुनें। संपर्क की तारीखें और मूल संदेश सुरक्षित रखें। जवाब देना आवश्यक नहीं; ब्लॉक तभी करें जब सुरक्षित लगे।',account:'भरोसेमंद डिवाइस से ईमेल पहले सुरक्षित करें। अलग पासवर्ड और MFA लगाएँ, सक्रिय सत्र और रिकवरी विवरण देखें। आधिकारिक रिकवरी पेज ही इस्तेमाल करें।',evidence:'मूल संदेश, प्रोफ़ाइल URL, तारीख और संदर्भ सुरक्षित रखें। निजी प्रमाण यहाँ अपलोड नहीं होते। मूल फाइल बदलने से बचें।'},fullMr={...mr,impersonation:'नकली प्रोफाइलशी वाद घालू नका, त्यामुळे धोका वाढू शकतो. प्रोफाइल URL, वापरकर्तानाव आणि तारीख जतन करा. प्लॅटफॉर्मवर तक्रार करा आणि खाते सुरक्षित करा.',doxxing:'आधी शारीरिक सुरक्षिततेचा विचार करा. उघड झालेल्या माहितीचे URL आणि तारीख जतन करा; ती पुन्हा शेअर करू नका. विश्वासू उपकरणावरून पासवर्ड व स्थान-वाटप तपासा.',unwanted:'तातडीचा धोका असल्यास सुरक्षित ठिकाणी जा आणि विश्वासू मदत घ्या. संपर्काच्या तारखा व मूळ संदेश जतन करा. उत्तर देणे आवश्यक नाही; सुरक्षित वाटल्यासच ब्लॉक करा.',account:'विश्वासू उपकरणावरून आधी ईमेल सुरक्षित करा. वेगळा पासवर्ड व MFA वापरा, सत्रे आणि पुनर्प्राप्ती माहिती तपासा. अधिकृत पुनर्प्राप्ती पृष्ठच वापरा.',evidence:'मूळ संदेश, प्रोफाइल URL, तारीख आणि संदर्भ जतन करा. खाजगी पुरावे येथे अपलोड होत नाहीत. मूळ फाइल बदलू नका.'};let trans=data.settings.language==='hi'?fullHi:data.settings.language==='mr'?fullMr:{};document.getElementById('advice').innerHTML=`<div class="callout ok"><b>${esc(id)}</b><br>${esc(trans[id]||text)}</div>`}
function openGuide(id){let names={sextortion:'Sextortion & blackmail',impersonation:'Impersonation',unwanted:'Repeated unwanted contact',doxxing:'Doxxing & threats',account:'Account compromise'},steps=guideText[id]||[];showModal(`<h2>${names[id]}</h2><p>Skip anything that does not feel safe. Nothing is transmitted.</p>${steps.map((s,i)=>`<div class="guide-card"><b>${['1 · Immediate safety','2 · Preserve evidence','3 · Account/platform safety','4 · Reporting options','5 · Optional response'][i]}</b><p>${esc(s)}</p></div>`).join('')}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();incidentModal('${id}')">Save incident</button></div>`)}
function simPage(){return `${header('Emergency workflow simulator','DEMO MODE — all events are simulated; no emergency communication occurs. Scenarios can be repeated/reset.')}<div class="grid two"><section class="panel"><h3>Choose a scenario</h3><div class="list">${[['success','Simulated successful sending'],['poor','Poor network / queue'],['offline','No network → restored connectivity'],['failed','Failed send'],['missed','Missed check-in reminder'],['cancel','Grace-period cancellation'],['escalate','Escalation attempt'],['ack','Contact acknowledgement']].map(a=>`<button class="listitem" onclick="runScenario('${a[0]}')"><b>${a[1]} · DEMO</b><span>▶</span></button>`).join('')}</div><button class="btn danger small" onclick="resetDemo()">Reset simulator</button></section><section class="panel"><h3>Demo event log</h3><div id="scenarioLog">${sessionStorage.getItem('scenarioLog')||empty('Select a scenario.')}</div><p class="tiny muted">Demo events stored separately from real queued SOS records.</p></section></div>`}
function runScenario(type){let texts={success:['DEMO: Alert prepared','DEMO: Simulated transport accepted request','DEMO: Sent status (not delivered; no real transport)'],poor:['DEMO: Poor connectivity detected','DEMO: Alert queued; no send attempted'],offline:['DEMO: Offline; alert queued','DEMO: Connectivity restored','DEMO: Retry available, but transport is not configured'],failed:['DEMO: Simulated transport failed; status Failed'],missed:['DEMO: Check-in reminder displayed; grace period started'],cancel:['DEMO: User cancelled within grace; escalation prevented'],escalate:['DEMO: Grace expired; alert attempt queued','DEMO: No contacts alerted; no transport configured'],ack:['DEMO: Contact acknowledgement recorded; no contact received an alert']};let log=(texts[type]||texts.failed).map(t=>`<div class="event"><h4>${esc(t)}</h4><p>${new Date().toLocaleTimeString()} · DEMO</p></div>`).join('');sessionStorage.setItem('scenarioLog',`<div class="timeline">${log}</div>`);data.demo.lastScenario={type,time:Date.now(),label:'DEMO'};save();render();toast('DEMO only — no real communication')}
function resetDemo(){sessionStorage.removeItem('scenarioLog');delete data.demo.lastScenario;save();render();toast('Simulator reset; real SOS history unchanged')}
function clearData(){if(confirm('Delete all Saheli data from this browser?')){localStorage.removeItem(STORE);data=structuredClone(defaults);save();openEvidenceDB().then(db=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').clear()});clearInterval(journeyTimer);toast('Local Saheli data and evidence files deleted');setPage('home')}}
function deleteContact(id){if(confirm('Remove contact locally?')){data.contacts=data.contacts.filter(c=>c.id!==id);save();render()}}
function call112(){window.location.href='tel:112';toast('Your device may open the phone app; call completion cannot be confirmed.')}
function inspectImage(e){/* existing local metadata inspection is retained */}

if(data.journey)startJourneyTimer();

window.saheliBridge={snapshot:()=>JSON.parse(JSON.stringify(data)),settings:()=>({...data.settings}),header:(t,d)=>header(t,d),getPage:()=>page};
function accountPage(){return `<h1 class="page-title">Account & sync</h1><p class="page-intro">Local emergency access remains available while signed out or offline.</p><div id="accountRoot"><div class="empty">Loading account status…</div></div><section class="panel" style="margin-top:14px"><div class="card-top"><h3>Authenticated account records</h3><button class="btn secondary small" onclick="window.saheliIntegrations?.refreshRemoteSummary?.()">Refresh</button></div><div id="remoteCounts" class="tiny muted">Sign in to load account-only record counts.</div></section><div class="callout">Local only: this browser and IndexedDB. Synced: only categories you explicitly import. Community reports: details you deliberately share; reporter identity is not public. Supabase is not end-to-end encrypted.</div>`}
function mapPage(){return `<h1 class="page-title">Safety map</h1><p class="page-intro">Google Map appears only with a configured API key. Community reports are not confirmed crime or a safety rating.</p><div class="grid two"><section class="panel"><div class="card-top"><h3>Map & route planner</h3><span class="badge">COMMUNITY CONTEXT ONLY</span></div><div id="mapStatus" class="callout">Preparing map…</div><div id="googleMap" style="width:100%;height:360px;min-height:260px;border-radius:12px;background:#f4f3ef;display:grid;place-items:center" aria-label="Google map"></div><div class="row" style="margin:10px 0"><button class="btn secondary small" id="locateButton">◎ Use my location</button><span class="tiny muted">Location requested only on click; no continuous tracking.</span></div><div class="field"><label>Selected report location</label><span id="selectedLocation" class="tiny muted">Click map to choose a point or enter coordinates below.</span><div class="form-grid" style="margin-top:7px"><div class="field"><label>Manual latitude</label><input id="manualLat" inputmode="decimal" type="number" min="-90" max="90" step="any"></div><div class="field"><label>Manual longitude</label><input id="manualLng" inputmode="decimal" type="number" min="-180" max="180" step="any"></div></div><button class="btn secondary small" id="manualPointButton" style="margin-top:7px">Use manual point</button></div><div class="divider"></div><h3 style="font-size:14px">Directions (ordinary routing only)</h3><div class="form-grid"><div class="field"><label>Start (optional)</label><input id="routeStart" placeholder="Address or leave blank for map center"></div><div class="field"><label>Destination</label><input id="routeDestination" placeholder="Enter destination"></div></div><div class="row" style="margin-top:10px"><button class="btn primary small" id="routeButton">Get walking directions</button><button class="btn secondary small" id="externalRouteButton">Open Google Maps</button></div><p class="tiny muted">Directions are not a safety assessment. No route is guaranteed safe.</p></section><section class="panel"><div class="card-top"><h3>Community reports</h3><span class="badge amber">MODERATED / UNVERIFIED</span></div><div class="form-grid"><div class="field"><label>Category filter</label><select id="filterCategory"><option value="all">All</option><option>Lighting</option><option>Harassment</option><option>Transport</option><option>Other concern</option></select></div><div class="field"><label>Recency</label><select id="filterRecency"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">Any (up to 1 year)</option></select></div><div class="field full"><label>Public verification status</label><select id="filterVerified"><option value="all">Public reports (moderator verified)</option><option value="my">My reports (includes pending)</option></select></div></div><div class="row" style="margin:8px 0"><span class="badge green">✓ Moderator approved</span><span class="badge amber">! Pending reports visible only to reporter</span></div><div id="reportList"><div class="empty">Reports require database setup.</div></div><div class="divider"></div><h3 style="font-size:14px">Submit felt-unsafe report</h3><p class="tiny muted">Requires sign-in and consent. Exact coordinates are not stored; public coordinates are rounded to about 100 m and remain pending review.</p><div class="form-grid"><div class="field"><label>Category</label><select id="newReportCategory"><option>Lighting</option><option>Harassment</option><option>Transport</option><option>Other concern</option></select></div><div class="field"><label>Severity (your experience)</label><select id="newReportSeverity"><option value="low">Low</option><option value="moderate">Moderate</option><option value="high">High</option></select></div><div class="field full"><label>Description (optional; do not identify people)</label><textarea id="newReportDescription" maxlength="1000"></textarea></div><div class="field full"><label><input type="checkbox" id="reportConsent"> I consent to share this category, severity, optional description, and approximate location for moderation. This does not report confirmed criminal activity.</label></div></div><div class="row"><button class="btn primary" id="submitReport">Review & submit</button><span id="submitReportStatus" class="tiny muted" aria-live="polite"></span></div><div class="divider"></div><h3 style="font-size:14px">My submitted reports</h3><div id="myReports"><div class="tiny muted">Sign in to view report status.</div></div><div class="callout warn">No reports does not mean a place is safe. No crime score or safe-route score is generated.</div><div class="divider"></div><div class="card-top"><h3>On-device notes (not shared)</h3><button class="btn secondary small" onclick="reportModal()">＋ Add local note</button></div><p class="tiny muted">Older device-only reports remain private and do not appear on the public map.</p>${data.reports.length?`<div class="list">${data.reports.map(r=>`<div class="listitem"><div><b>${esc(r.category)} · ${esc(r.area)}</b><small>${safeDate(r.time)} · ${esc(r.severity)} · Device-only</small><small>${esc(r.note)}</small></div><button class="btn danger small" onclick="deleteReport('${r.id}')">Delete</button></div>`).join('')}</div>`:empty('No device-only reports saved.')}</section></div>`}
function exportMobileMigration(){if(!confirm('This export may include trusted contact details and incident notes. Keep the file private. Continue?'))return;const payload={format:'saheli-web-export-v1',exportedAt:new Date().toISOString(),contacts:data.contacts.map(c=>({id:c.id,name:c.name,phone:c.phone,types:c.types||[]})),alerts:data.alerts.filter(a=>a.kind==='SOS alert').map(a=>({kind:a.kind,time:a.time,status:a.status})),journey:data.journey?{destination:data.journey.destination,arrival:data.journey.arrival,interval:data.journey.interval,nextCheck:data.journey.nextCheck}:null,incidents:data.incidents.map(i=>({title:i.title,category:i.category,note:i.note||'',sender:i.sender||'',risk:i.risk||'Low',time:i.time}))};download('saheli-web-migration.json',JSON.stringify(payload,null,2),'application/json');toast('Migration export created. Evidence attachments are excluded.')}
